[project]
name = "pico2-genart-bot"
version = "0.1.0"
description = "Autonomous generative-art pipeline for a Raspberry Pi Pico 2 W"
readme = "README.md"
authors = [
    { name = "pjkarlik", email = "pjkarlik@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "atproto>=0.0.69",
    "pillow>=11.3.0",
    "pyserial>=3.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
